<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitStack View DevKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* === Reset & Tokens === */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --sidebar-w: 220px;
    --panel-h: 240px;
    --ks-paper: #faf7f1;
    --ks-paper-warm: #f4ede0;
    --ks-paper-deep: #ece3d1;
    --ks-ink: #171512;
    --ks-ink2: #2a251f;
    --ks-muted: #6b6357;
    --ks-faint: #b8ae9b;
    --ks-line: #1a1814;
    --ks-hair: #d9ceb8;
    --ks-accent: #d65a2f;
    --ks-accent-deep: #a8411e;
    --ks-accent-soft: #f7d9c8;
    --ks-hi: #ffe45c;
    --font-serif: "Instrument Serif", Georgia, serif;
    --font-sans: "Inter", system-ui, -apple-system, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  body {
    font-family: var(--font-sans);
    background: var(--ks-paper);
    color: var(--ks-ink);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* === Layout === */
  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    grid-template-rows: 50px 1fr var(--panel-h);
    height: 100vh;
  }

  /* === Header === */
  .header {
    grid-column: 1 / -1;
    background: var(--ks-ink);
    color: var(--ks-paper);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 14px;
    font-size: 13px;
  }
  .header .logo {
    font-family: var(--font-serif);
    font-size: 18px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .header .logo .accent { color: var(--ks-accent); }
  .header .kit-name {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ks-faint);
    background: rgba(255,255,255,0.06);
    padding: 3px 10px;
    border-radius: 100px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .header .spacer { flex: 1; }
  .header button {
    font-family: var(--font-sans);
    background: rgba(255,255,255,0.08);
    color: var(--ks-paper-warm);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 5px;
    letter-spacing: 0.01em;
  }
  .header button:hover {
    background: rgba(255,255,255,0.14);
    color: #fff;
    transform: translateY(-1px);
  }

  /* === Sidebar === */
  .sidebar {
    background: var(--ks-paper);
    border-right: 1px solid var(--ks-hair);
    padding: 16px 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .sidebar h3 {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ks-faint);
    padding: 0 16px;
    margin-bottom: 10px;
  }
  .sidebar .view-item {
    padding: 9px 16px 9px 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 400;
    color: var(--ks-muted);
    border-left: 2.5px solid transparent;
    transition: all 0.15s ease;
    position: relative;
  }
  .sidebar .view-item:hover {
    background: var(--ks-paper-warm);
    color: var(--ks-ink);
  }
  .sidebar .view-item.active {
    background: var(--ks-accent-soft);
    border-left-color: var(--ks-accent);
    color: var(--ks-accent-deep);
    font-weight: 500;
  }
  .sidebar .view-desc {
    font-size: 11px;
    color: var(--ks-faint);
    margin-top: 2px;
    line-height: 1.4;
  }
  .sidebar .view-item.active .view-desc {
    color: var(--ks-accent);
    opacity: 0.7;
  }

  /* === Viewport === */
  .viewport {
    background: var(--ks-paper-warm);
    background-image:
      radial-gradient(circle, var(--ks-hair) 0.8px, transparent 0.8px);
    background-size: 24px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: auto;
  }
  .viewport .frame-container {
    background: #fff;
    border: 1px solid var(--ks-hair);
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 1px 2px rgba(23, 21, 18, 0.04),
      0 4px 16px rgba(23, 21, 18, 0.06),
      0 12px 40px rgba(23, 21, 18, 0.04);
    max-width: 1024px;
    transition: width 0.5s var(--ease-out), max-width 0.5s var(--ease-out);
  }
  .viewport iframe { width: 100%; border: none; min-height: 400px; display: block; }
  .viewport .empty {
    color: var(--ks-faint);
    font-size: 14px;
    font-family: var(--font-serif);
    font-style: italic;
    letter-spacing: 0.01em;
  }

  /* === Panels === */
  .panels {
    grid-column: 1 / -1;
    background: #fff;
    border-top: 1px solid var(--ks-hair);
    display: flex;
  }
  .panel {
    flex: 1;
    border-right: 1px solid var(--ks-paper-warm);
    padding: 14px 16px;
    overflow-y: auto;
    font-size: 12px;
  }
  .panel:last-child { border-right: none; }
  .panel h4 {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ks-faint);
    margin-bottom: 10px;
  }
  .panel pre {
    background: var(--ks-paper-warm);
    border: 1px solid var(--ks-hair);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre-wrap;
    max-height: 170px;
    overflow-y: auto;
    color: var(--ks-ink2);
    tab-size: 2;
  }

  /* Tool log entries */
  .panel .log-entry {
    padding: 7px 10px;
    margin-bottom: 4px;
    background: var(--ks-paper);
    border: 1px solid var(--ks-hair);
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.6;
    word-break: break-all;
    animation: logSlideIn 0.2s var(--ease-out);
  }
  @keyframes logSlideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .panel .log-tool {
    color: var(--ks-accent);
    font-weight: 500;
  }
  .panel .log-time {
    color: var(--ks-faint);
    font-size: 10px;
    margin-right: 6px;
  }
  .panel .log-ms {
    color: var(--ks-faint);
    font-size: 10px;
    font-weight: 500;
    background: var(--ks-paper-warm);
    padding: 1px 6px;
    border-radius: 100px;
    margin-left: 4px;
  }

  /* === Controls === */
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 12px;
  }

  /* Toggle switch */
  .toggle-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--ks-muted);
    display: flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s ease;
  }
  .toggle-label:hover { color: var(--ks-ink); }
  .toggle-label input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 30px;
    height: 17px;
    background: var(--ks-hair);
    border-radius: 100px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }
  .toggle-label input[type="checkbox"]::after {
    content: "";
    position: absolute;
    top: 2.5px;
    left: 2.5px;
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s var(--ease-out);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .toggle-label input[type="checkbox"]:checked {
    background: var(--ks-accent);
  }
  .toggle-label input[type="checkbox"]:checked::after {
    transform: translateX(13px);
  }

  /* Segmented control */
  .segmented {
    display: inline-flex;
    background: var(--ks-paper-warm);
    border: 1px solid var(--ks-hair);
    border-radius: 100px;
    padding: 2px;
    gap: 0;
  }
  .size-btn {
    font-family: var(--font-sans);
    background: transparent;
    border: none;
    border-radius: 100px;
    padding: 4px 12px;
    font-size: 11px;
    font-weight: 500;
    color: var(--ks-muted);
    cursor: pointer;
    transition: all 0.2s ease;
    line-height: 1;
  }
  .size-btn:hover {
    color: var(--ks-ink);
  }
  .size-btn.active {
    background: var(--ks-ink);
    color: var(--ks-paper);
    box-shadow: 0 1px 3px rgba(23, 21, 18, 0.15);
  }
</style>
</head>
<body>

<div class="layout">
  <!-- Header -->
  <div class="header">
    <span class="logo">kitstack<span class="accent">.devkit</span></span>
    <span class="kit-name" id="kit-name"></span>
    <span class="spacer"></span>
    <button id="btn-reload" title="Re-run loader">&#8635; Reload</button>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Views</h3>
    <div id="view-list"></div>
  </div>

  <!-- Viewport -->
  <div class="viewport">
    <div id="viewport-content" class="empty">Select a view from the sidebar</div>
  </div>

  <!-- Panels -->
  <div class="panels">
    <!-- Data Inspector -->
    <div class="panel">
      <h4>Data Inspector</h4>
      <pre id="data-inspector">No data loaded</pre>
    </div>

    <!-- Tool Call Log -->
    <div class="panel">
      <h4>Tool Calls</h4>
      <div id="tool-log"><span style="color:var(--ks-faint);font-size:12px;font-style:italic;font-family:var(--font-serif)">No tool calls yet</span></div>
    </div>

    <!-- Capabilities -->
    <div class="panel">
      <h4>Capabilities</h4>
      <div class="controls">
        <label class="toggle-label"><input type="checkbox" id="cap-clipboard" checked> Clipboard</label>
        <label class="toggle-label"><input type="checkbox" id="cap-download" checked> Download</label>
        <label class="toggle-label"><input type="checkbox" id="cap-links" checked> Links</label>
      </div>
      <h4>Viewport</h4>
      <div class="controls">
        <div class="segmented">
          <button class="size-btn" data-w="375">Mobile</button>
          <button class="size-btn" data-w="768">Tablet</button>
          <button class="size-btn active" data-w="1024">Desktop</button>
          <button class="size-btn" data-w="full">Full</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
// DevKit host page — talks to backend via fetch, manages iframe protocol

// Kit metadata is injected by the dev server
const KIT_META = window.__DEVKIT_KIT__ || { id: "unknown", name: "Unknown", views: [], tools: [] };

document.getElementById("kit-name").textContent = `${KIT_META.name} (${KIT_META.tools.length} tools, ${KIT_META.views.length} views)`;

// --- View list ---
const viewList = document.getElementById("view-list");
let activeView = null;

KIT_META.views.forEach(v => {
  const el = document.createElement("div");
  el.className = "view-item";
  el.innerHTML = `<div>${v.name || v.slug}</div><div class="view-desc">${v.description || v.slug}</div>`;
  el.addEventListener("click", () => selectView(v.slug));
  viewList.appendChild(el);
});

// --- Capabilities ---
function getCapabilities() {
  return {
    clipboardWrite: document.getElementById("cap-clipboard").checked,
    downloadFile: document.getElementById("cap-download").checked,
    openLinks: document.getElementById("cap-links").checked,
  };
}

// --- Tool call log ---
const toolLogEl = document.getElementById("tool-log");

function logToolCall(name, args, result, ms) {
  if (toolLogEl.querySelector("span")) toolLogEl.innerHTML = "";
  const entry = document.createElement("div");
  entry.className = "log-entry";
  const time = new Date().toLocaleTimeString();
  entry.innerHTML = `<span class="log-time">${time}</span> <span class="log-tool">${name}</span>(${JSON.stringify(args).slice(0, 60)}) <span class="log-ms">${ms}ms</span>`;
  toolLogEl.prepend(entry);
}

// --- Data inspector ---
function updateDataInspector(data) {
  document.getElementById("data-inspector").textContent = JSON.stringify(data, null, 2);
}

// --- Viewport sizing ---
document.querySelectorAll(".size-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const container = document.querySelector(".frame-container");
    if (container) {
      const w = btn.dataset.w;
      if (w === "full") {
        container.style.width = "calc(100svw - var(--sidebar-w) - 32px)";
        container.style.maxWidth = "none";
      } else {
        container.style.width = w + "px";
        container.style.maxWidth = w + "px";
      }
    }
  });
});

// --- Reload button ---
document.getElementById("btn-reload").addEventListener("click", async () => {
  if (activeView) selectView(activeView);
});

// --- View selection & iframe protocol ---
let outerIframe = null;

async function selectView(slug) {
  activeView = slug;

  // Update sidebar
  viewList.querySelectorAll(".view-item").forEach((el, i) => {
    el.classList.toggle("active", KIT_META.views[i]?.slug === slug);
  });

  // Fetch loader data from backend
  let loaderData;
  try {
    const res = await fetch(`/__devkit/loader/${slug}`);
    loaderData = await res.json();
  } catch (err) {
    updateDataInspector({ error: err.message });
    return;
  }

  updateDataInspector(loaderData);

  // Fetch shell HTML from backend
  let shellHtml;
  try {
    const res = await fetch("/__devkit/shell");
    shellHtml = await res.text();
  } catch (err) {
    return;
  }

  // Create single iframe with shell HTML directly
  // (skip the double-iframe proxy — not needed for local dev)
  const viewport = document.getElementById("viewport-content");
  viewport.className = "";
  // Get current active size button width for initial container size
  const activeBtn = document.querySelector(".size-btn.active");
  const initW = activeBtn?.dataset.w;
  const initStyle = initW === "full"
    ? "width:calc(100svw - var(--sidebar-w) - 32px);max-width:none"
    : `width:${initW || 1024}px;max-width:${initW || 1024}px`;
  viewport.innerHTML = `<div class="frame-container" style="${initStyle}"><iframe id="outer-frame"></iframe></div>`;

  outerIframe = document.getElementById("outer-frame");
  outerIframe.srcdoc = shellHtml;

  // Listen for messages from the shell iframe
  window.addEventListener("message", async function handler(event) {
    if (!outerIframe || event.source !== outerIframe.contentWindow) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    // Handle JSON-RPC requests from the shell
    if ("id" in msg && msg.method) {
      const response = await handleAppRequest(msg.id, msg.method, msg.params || {}, slug);
      outerIframe.contentWindow.postMessage(response, "*");
      return;
    }

    // Handle notifications
    if (msg.method === "ui/notifications/initialized") {
      // Shell is ready — send tool-result with loader data
      const toolResult = {
        jsonrpc: "2.0",
        method: "ui/notifications/tool-result",
        params: {
          result: {
            content: [{
              type: "text",
              text: JSON.stringify({ kit: KIT_META.id, view: slug, app: slug, data: loaderData })
            }]
          }
        }
      };
      outerIframe.contentWindow.postMessage(toolResult, "*");
      return;
    }

    if (msg.method === "ui/notifications/size-changed") {
      if (msg.params?.height) {
        outerIframe.style.height = Math.max(msg.params.height, 200) + "px";
      }
    }
  });
}

async function handleAppRequest(id, method, params, viewSlug) {
  switch (method) {
    case "ui/initialize":
      return {
        jsonrpc: "2.0", id,
        result: {
          protocolVersion: "2026-01-26",
          hostCapabilities: getCapabilities(),
          hostInfo: { name: "KitStack DevKit", version: "1.0.0" },
        },
      };

    case "tools/call": {
      const { name, arguments: args } = params;

      // Route __load_view to loader endpoint
      if (name === "kit" && args?.cmd === "__load_view" && args?.params?.view) {
        const start = Date.now();
        try {
          const res = await fetch(`/__devkit/loader/${args.params.view}`);
          const data = await res.json();
          const ms = Date.now() - start;
          logToolCall("__load_view", { view: args.params.view }, data, ms);
          updateDataInspector(data);
          return {
            jsonrpc: "2.0", id,
            result: { content: [{ type: "text", text: JSON.stringify({ view: args.params.view, data }) }] },
          };
        } catch (err) {
          return { jsonrpc: "2.0", id, result: { content: [{ type: "text", text: err.message }], isError: true } };
        }
      }

      // Route regular tool calls to backend
      if (name === "kit" && args?.cmd) {
        const start = Date.now();
        try {
          const res = await fetch("/__devkit/tool", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ toolName: args.cmd, args: args.params || {} }),
          });
          const result = await res.json();
          const ms = Date.now() - start;
          logToolCall(args.cmd, args.params || {}, result, ms);
          return { jsonrpc: "2.0", id, result };
        } catch (err) {
          return { jsonrpc: "2.0", id, result: { content: [{ type: "text", text: err.message }], isError: true } };
        }
      }

      return { jsonrpc: "2.0", id, error: { code: -32602, message: "Invalid tool call" } };
    }

    case "ui/download-file":
      if (params?.contents?.[0]?.resource) {
        const r = params.contents[0].resource;
        const blob = new Blob([r.text || ""], { type: r.mimeType || "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = r.uri?.replace("file:///", "") || "download";
        a.click();
      }
      return { jsonrpc: "2.0", id, result: {} };

    case "ui/open-link":
      if (params?.url) window.open(params.url, "_blank");
      return { jsonrpc: "2.0", id, result: {} };

    default:
      return { jsonrpc: "2.0", id, error: { code: -32601, message: `Method not found: ${method}` } };
  }
}
</script>
</body>
</html>
