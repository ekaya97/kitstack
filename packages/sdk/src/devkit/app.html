<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KitStack View DevKit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --sidebar-w: 200px; --panel-h: 220px; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; height: 100vh; overflow: hidden; }

  .layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; grid-template-rows: 48px 1fr var(--panel-h); height: 100vh; }

  /* Header */
  .header { grid-column: 1 / -1; background: #1a1a1a; color: #fff; display: flex; align-items: center; padding: 0 16px; gap: 12px; font-size: 13px; }
  .header .logo { font-weight: 700; font-size: 14px; letter-spacing: 0.5px; }
  .header .kit-name { opacity: 0.6; }
  .header .spacer { flex: 1; }
  .header button { background: #333; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  .header button:hover { background: #444; color: #fff; }

  /* Sidebar */
  .sidebar { background: #fff; border-right: 1px solid #ddd; padding: 12px 0; overflow-y: auto; }
  .sidebar h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #999; padding: 0 12px; margin-bottom: 8px; }
  .sidebar .view-item { padding: 8px 12px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; }
  .sidebar .view-item:hover { background: #f0f0f0; }
  .sidebar .view-item.active { background: #e8f0fe; border-left-color: #1a73e8; color: #1a73e8; font-weight: 500; }
  .sidebar .view-desc { font-size: 10px; color: #999; margin-top: 2px; }

  /* Viewport */
  .viewport { background: #e8e8e8; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto; }
  .viewport .frame-container { background: #fff; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 1024px; }
  .viewport iframe { width: 100%; border: none; min-height: 400px; }
  .viewport .empty { color: #999; font-size: 14px; }

  /* Panels */
  .panels { grid-column: 1 / -1; background: #fff; border-top: 1px solid #ddd; display: flex; }
  .panel { flex: 1; border-right: 1px solid #eee; padding: 10px; overflow-y: auto; font-size: 12px; }
  .panel:last-child { border-right: none; }
  .panel h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #999; margin-bottom: 8px; }
  .panel pre { background: #f8f8f8; border: 1px solid #eee; border-radius: 3px; padding: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; max-height: 160px; overflow-y: auto; }
  .panel .log-entry { padding: 4px 0; border-bottom: 1px solid #f0f0f0; font-family: monospace; font-size: 11px; }
  .panel .log-tool { color: #1a73e8; font-weight: 500; }
  .panel .log-time { color: #999; margin-right: 6px; }
  .panel .log-ms { color: #999; font-size: 10px; }

  /* Controls */
  .controls { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .controls label { font-size: 11px; color: #666; display: flex; align-items: center; gap: 4px; }
  .controls input[type="checkbox"] { margin: 0; }
  .size-btn { background: #eee; border: 1px solid #ddd; border-radius: 3px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .size-btn.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }
</style>
</head>
<body>

<div class="layout">
  <!-- Header -->
  <div class="header">
    <span class="logo">KitStack DevKit</span>
    <span class="kit-name" id="kit-name"></span>
    <span class="spacer"></span>
    <button id="btn-reload" title="Re-run loader">↻ Reload</button>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Views</h3>
    <div id="view-list"></div>
  </div>

  <!-- Viewport -->
  <div class="viewport">
    <div id="viewport-content" class="empty">Select a view from the sidebar</div>
  </div>

  <!-- Panels -->
  <div class="panels">
    <!-- Data Inspector -->
    <div class="panel">
      <h4>Data Inspector</h4>
      <pre id="data-inspector">No data loaded</pre>
    </div>

    <!-- Tool Call Log -->
    <div class="panel">
      <h4>Tool Calls</h4>
      <div id="tool-log"><span style="color:#999">No tool calls yet</span></div>
    </div>

    <!-- Capabilities -->
    <div class="panel">
      <h4>Capabilities</h4>
      <div class="controls">
        <label><input type="checkbox" id="cap-clipboard" checked> Clipboard</label>
        <label><input type="checkbox" id="cap-download" checked> Download</label>
        <label><input type="checkbox" id="cap-links" checked> Links</label>
      </div>
      <h4>Viewport</h4>
      <div class="controls">
        <button class="size-btn" data-w="375">Mobile</button>
        <button class="size-btn" data-w="768">Tablet</button>
        <button class="size-btn active" data-w="1024">Desktop</button>
        <button class="size-btn" data-w="100%">Full</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
// DevKit host page — talks to backend via fetch, manages iframe protocol

// Kit metadata is injected by the dev server
const KIT_META = window.__DEVKIT_KIT__ || { id: "unknown", name: "Unknown", views: [], tools: [] };

document.getElementById("kit-name").textContent = `${KIT_META.name} (${KIT_META.tools.length} tools, ${KIT_META.views.length} views)`;

// --- View list ---
const viewList = document.getElementById("view-list");
let activeView = null;

KIT_META.views.forEach(v => {
  const el = document.createElement("div");
  el.className = "view-item";
  el.innerHTML = `<div>${v.name || v.slug}</div><div class="view-desc">${v.description || v.slug}</div>`;
  el.addEventListener("click", () => selectView(v.slug));
  viewList.appendChild(el);
});

// --- Capabilities ---
function getCapabilities() {
  return {
    clipboardWrite: document.getElementById("cap-clipboard").checked,
    downloadFile: document.getElementById("cap-download").checked,
    openLinks: document.getElementById("cap-links").checked,
  };
}

// --- Tool call log ---
const toolLogEl = document.getElementById("tool-log");

function logToolCall(name, args, result, ms) {
  if (toolLogEl.querySelector("span")) toolLogEl.innerHTML = "";
  const entry = document.createElement("div");
  entry.className = "log-entry";
  const time = new Date().toLocaleTimeString();
  entry.innerHTML = `<span class="log-time">${time}</span> <span class="log-tool">${name}</span>(${JSON.stringify(args).slice(0, 60)}) <span class="log-ms">${ms}ms</span>`;
  toolLogEl.prepend(entry);
}

// --- Data inspector ---
function updateDataInspector(data) {
  document.getElementById("data-inspector").textContent = JSON.stringify(data, null, 2);
}

// --- Viewport sizing ---
document.querySelectorAll(".size-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const container = document.querySelector(".frame-container");
    if (container) {
      const w = btn.dataset.w;
      container.style.maxWidth = w === "100%" ? "none" : w + "px";
    }
  });
});

// --- Reload button ---
document.getElementById("btn-reload").addEventListener("click", async () => {
  if (activeView) selectView(activeView);
});

// --- View selection & iframe protocol ---
let outerIframe = null;

async function selectView(slug) {
  activeView = slug;

  // Update sidebar
  viewList.querySelectorAll(".view-item").forEach((el, i) => {
    el.classList.toggle("active", KIT_META.views[i]?.slug === slug);
  });

  // Fetch loader data from backend
  let loaderData;
  try {
    const res = await fetch(`/__devkit/loader/${slug}`);
    loaderData = await res.json();
  } catch (err) {
    updateDataInspector({ error: err.message });
    return;
  }

  updateDataInspector(loaderData);

  // Fetch shell HTML from backend
  let shellHtml;
  try {
    const res = await fetch("/__devkit/shell");
    shellHtml = await res.text();
  } catch (err) {
    return;
  }

  // Fetch proxy HTML from backend
  let proxyHtml;
  try {
    const res = await fetch("/__devkit/proxy");
    proxyHtml = await res.text();
  } catch (err) {
    return;
  }

  // Create the double iframe
  const viewport = document.getElementById("viewport-content");
  viewport.className = "";
  viewport.innerHTML = '<div class="frame-container"><iframe id="outer-frame"></iframe></div>';

  outerIframe = document.getElementById("outer-frame");
  outerIframe.srcdoc = proxyHtml;

  // Listen for messages from the outer iframe (proxy)
  window.addEventListener("message", async function handler(event) {
    if (event.source !== outerIframe.contentWindow) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    // Handle JSON-RPC requests from the app
    if ("id" in msg && msg.method) {
      const response = await handleAppRequest(msg.id, msg.method, msg.params || {}, slug);
      outerIframe.contentWindow.postMessage(response, "*");
      return;
    }

    // Handle notifications
    if (msg.method === "ui/notifications/initialized") {
      // App is ready — send tool-result with loader data
      const toolResult = {
        jsonrpc: "2.0",
        method: "ui/notifications/tool-result",
        params: {
          result: {
            content: [{
              type: "text",
              text: JSON.stringify({ kit: KIT_META.id, view: slug, cmd: "__show", data: loaderData })
            }]
          }
        }
      };
      outerIframe.contentWindow.postMessage(toolResult, "*");
      return;
    }

    if (msg.method === "ui/notifications/size-changed") {
      if (msg.params?.height) {
        outerIframe.style.height = Math.max(msg.params.height, 200) + "px";
      }
    }
  });
}

async function handleAppRequest(id, method, params, viewSlug) {
  switch (method) {
    case "ui/initialize":
      return {
        jsonrpc: "2.0", id,
        result: {
          protocolVersion: "2026-01-26",
          hostCapabilities: getCapabilities(),
          hostInfo: { name: "KitStack DevKit", version: "1.0.0" },
        },
      };

    case "tools/call": {
      const { name, arguments: args } = params;

      // Route __load_view to loader endpoint
      if (name === "kit" && args?.cmd === "__load_view" && args?.params?.view) {
        const start = Date.now();
        try {
          const res = await fetch(`/__devkit/loader/${args.params.view}`);
          const data = await res.json();
          const ms = Date.now() - start;
          logToolCall("__load_view", { view: args.params.view }, data, ms);
          updateDataInspector(data);
          return {
            jsonrpc: "2.0", id,
            result: { content: [{ type: "text", text: JSON.stringify({ view: args.params.view, data }) }] },
          };
        } catch (err) {
          return { jsonrpc: "2.0", id, result: { content: [{ type: "text", text: err.message }], isError: true } };
        }
      }

      // Route regular tool calls to backend
      if (name === "kit" && args?.cmd) {
        const start = Date.now();
        try {
          const res = await fetch("/__devkit/tool", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ toolName: args.cmd, args: args.params || {} }),
          });
          const result = await res.json();
          const ms = Date.now() - start;
          logToolCall(args.cmd, args.params || {}, result, ms);
          return { jsonrpc: "2.0", id, result };
        } catch (err) {
          return { jsonrpc: "2.0", id, result: { content: [{ type: "text", text: err.message }], isError: true } };
        }
      }

      return { jsonrpc: "2.0", id, error: { code: -32602, message: "Invalid tool call" } };
    }

    case "ui/download-file":
      if (params?.contents?.[0]?.resource) {
        const r = params.contents[0].resource;
        const blob = new Blob([r.text || ""], { type: r.mimeType || "text/plain" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = r.uri?.replace("file:///", "") || "download";
        a.click();
      }
      return { jsonrpc: "2.0", id, result: {} };

    case "ui/open-link":
      if (params?.url) window.open(params.url, "_blank");
      return { jsonrpc: "2.0", id, result: {} };

    default:
      return { jsonrpc: "2.0", id, error: { code: -32601, message: `Method not found: ${method}` } };
  }
}
</script>
</body>
</html>
